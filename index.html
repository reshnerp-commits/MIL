<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Me</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 400px; margin: 40px auto; padding: 0 20px; }
    label { display: block; margin: 10px 0 5px; font-weight: 500; }
    textarea { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; resize: vertical; }
    button { background: #0057ff; color: white; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; }
    button:hover { background: #0047cc; }
  </style>
</head>
<body>
  <h2>Message Me</h2>
  <form action="https://formsubmit.co/reshnerp@gmail.com" method="POST">
    <label for="message">Your Message</label>
    <textarea id="message" name="message" rows="5" required placeholder="Type your message here..."></textarea>

    <!-- Spam protection & settings -->
    <input type="text" name="_honey" style="display:none">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" value="https://yourwebsite.com/thanks.html">

    <button type="submit">Send</button>
  </form>
</body>
</html>
